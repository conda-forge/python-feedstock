# Override Python `zip_keys`
python:
  - 3.12
numpy:
  - 2
python_impl:
  - cpython
is_python_min:
  - no

# Configuration for debug and release builds
build_type:
  - release
  - debug                      # [not win]
channel_targets:
  - conda-forge main
  - conda-forge python_debug   # [not win]
zip_keys:
  - build_type
  - channel_targets
