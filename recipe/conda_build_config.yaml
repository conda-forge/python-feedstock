# Override Python `zip_keys`
python:
  - 3.13
numpy:
  - 2
python_impl:
  - cpython
is_python_min:
  - no

# Whether to build free-threaded Python (3.13+)
freethreading:
  - yes
  - no

channel_sources:
  - conda-forge

# Configuration for debug and release builds
build_type:
  - release
  - debug                      # [not win]
channel_targets:
  - conda-forge main
  - conda-forge python_debug   # [not win]
zip_keys:
  - build_type
  - channel_targets
