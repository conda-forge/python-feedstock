python:
  - 3.9
python_impl:
  - cpython
is_python_min:
  - no
numpy:
  - 1.16
MACOSX_SDK_VERSION:            # [osx and x86_64]
  - 11.0                       # [osx and x86_64]
# CPython 3.9 builds against Tcl/Tk 8.6: tk 9.x no longer ships tcl.h/tk.h in the
# layout this recipe expects, so _tkinter would fail to compile. conda-forge
# pinning already pins tk 8.6 for most platforms, but the generated
# .ci_support/linux_ppc64le_.yaml on this branch predates that pin.
tk:
  - '8.6'
