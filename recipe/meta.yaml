{% set version = "3.11.16" %}
{% set dev = "" %}
{% set dev_ = "" %}
{% set ver2 = '.'.join(version.split('.')[0:2]) %}
{% set ver2nd = ''.join(version.split('.')[0:2]) %}
{% set ver3nd = ''.join(version.split('.')[0:3]) %}
{% set build_number = 1 %}

# this makes the linter happy
{% set channel_targets = channel_targets or 'conda-forge main' %}

# Sanitize build system env. var tweak parameters
# (passed to the build scripts via script_env).
{% set dbg_abi = "" %}
{% if build_type == "debug" %}
  {% set py_interp_debug = "yes" %}
  {% set debug = "_debug" %}
{% else %}
  {% set py_interp_debug = "no" %}
  {% set debug = "" %}
{% endif %}

# CMake needs to be told that the debug ABI is fine; the option takes a 4-tuple,
# Python_FIND_ABI=<pydebug>;<pymalloc>;<unicode>;<gil_disabled>; for details see
# https://cmake.org/cmake/help/latest/module/FindPython.html#hints
{% set cmake_test_args=" -DPython_FIND_ABI=\"" ~ ("ON" if build_type == "debug" else "OFF") ~ ";ANY;ANY;ANY\"" %}
{% if unix %}
  # for CMake invocations during testing, we need to avoid accidentally picking up python versions from
  # the image, but we don't want to use `${CMAKE_ARGS}` from the compiler activation, because that contains
  # `CMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER`; while that's useful for building (i.e. don't look in `host:`,
  # because we want to use binaries from `build:`), we want the exact opposite when running tests.
  {% set cmake_test_args=cmake_test_args ~ " -DCMAKE_POLICY_DEFAULT_CMP0094=NEW -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=ONLY -DCMAKE_FIND_ROOT_PATH=${PREFIX}" %}
{% endif %}

package:
  name: python-split
  version: {{ version }}{{ dev }}

source:
  - url: https://www.python.org/ftp/python/{{ version }}/Python-{{ version }}{{ dev }}.tar.xz
    # sha256 from: https://www.python.org/downloads/release/python-{{ ver3nd }}/
    sha256: 91bcdebfdde239a003ae93738a7fce0f9230fee5c4bc2b86f6e6e8c6f98aabe8
    patches:
      - patches/0001-Win32-Change-FD_SETSIZE-from-512-to-2048.patch
      - patches/0002-Win32-distutils-Add-support-to-cygwinccompiler-for-V.patch
      # https://github.com/python/cpython/pull/28501
      - patches/0003-bpo-45258-search-for-isysroot-in-addition-to-sysroot.patch
      # https://github.com/pypa/distutils/pull/54
      - patches/0004-runtime_library_dir_option-Use-1st-word-of-CC-as-com.patch
      - patches/0005-Win32-Do-not-download-externals.patch
      - patches/0006-Fix-find_library-so-that-it-looks-in-sys.prefix-lib-.patch
      # https://github.com/python/cpython/pull/28397
      - patches/0007-bpo-22699-Allow-compiling-on-debian-ubuntu-with-a-di.patch
      - patches/0008-Disable-registry-lookup-unless-CONDA_PY_ALLOW_REG_PA.patch
      - patches/0009-Unvendor-openssl.patch
      - patches/0010-Unvendor-sqlite3.patch
      # https://github.com/pypa/distutils/pull/53
      - patches/0011-Use-ranlib-from-env-if-env-variable-is-set.patch
      - patches/0012-Add-CondaEcosystemModifyDllSearchPath.patch
      - patches/0013-Add-d1trimfile-SRC_DIR-to-make-pdbs-more-relocatable.patch
      - patches/0014-Doing-d1trimfile.patch
      # https://github.com/python/cpython/pull/23523
      - patches/0015-cross-compile-darwin.patch
      - patches/0016-Fix-TZPATH-on-windows.patch
      # https://github.com/python/cpython/pull/24324
      - patches/0017-Make-dyld-search-work-with-SYSTEM_VERSION_COMPAT-1.patch
      # https://github.com/pypa/distutils/pull/53
      - patches/0018-Fix-LDSHARED-when-CC-is-overriden-on-Linux-too.patch
      - patches/0019-Unvendor-bzip2.patch
      - patches/0020-Unvendor-libffi.patch
      - patches/0021-Unvendor-tcltk.patch
      - patches/0022-unvendor-xz.patch
      - patches/0023-unvendor-zlib.patch
      - patches/0024-Do-not-pass-g-to-GCC-when-not-Py_DEBUG.patch
      - patches/0025-Unvendor-expat.patch
      - patches/0026-Do-not-define-pid_t-as-it-might-conflict-with-the-ac.patch

build:
  number: {{ build_number }}

requirements:
  build:
    - patch  # [not win]
    - m2-patch  # [win]
    - m2-gcc-libs  # [win]

outputs:
  - name: python
    script: build_base.sh  # [unix]
    script: build_base.bat  # [win]
    build:
      number: {{ build_number }}
      activate_in_script: true
      # Windows has issues updating python if conda is using files itself.
      # Copy rather than link.
      no_link:
        - DLLs/_ctypes.pyd  # [win]
      ignore_run_exports_from:
        # C++ only installed so CXX is defined for distutils/sysconfig.
        - {{ compiler('cxx') }}  # [unix]
        # These two are just to get the headers needed for tk.h, but is unused
        - xorg-libx11            # [unix]
        - xorg-xorgproto         # [unix]
      # Disabled until verified to work correctly
      detect_binary_files_with_prefix: true
      # detect_binary_files_with_prefix: False
      # binary_has_prefix_files:
      #   - lib/libpython{{ ver2 }}.*.1.0
      #   - bin/python{{ ver2 }}  # [linux]
      #   - lib/libpython{{ ver2 }}.a  # [linux]
      #   - lib/libpython{{ ver2 }}.nolto.a  # [linux]
      #   - lib/libpython3.so  # [linux]
      #   - lib/python{{ ver2 }}/lib-dynload/_hashlib.cpython-{{ ver2nd }}-x86_64-linux-gnu.so  # [linux]
      #   - lib/libpython3.dylib  # [osx]
      # match python.org compiler standard
      skip: true  # [win and int(float(vc)) < 14]
      skip_compile_pyc:
        - '*.py'            # [build_platform != target_platform]
      string: {{ dev_ }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}{{ debug }}_cpython
      run_exports:
        noarch:
          - python
        weak:
          - python_abi {{ ver2 }}.* *_cp{{ ver2nd }}
{% if py_interp_debug == "yes" %}
          - python {{ ver2 }}.* *_debug_cpython
{% endif %}
      script_env:
        - PY_INTERP_DEBUG={{ py_interp_debug }}
        # Putting these here means they get emitted to build_env_setup.{sh,bat} meaning we can launch IDEs
        # after sourcing or calling that script without examine the contents of conda_build.{sh,bat} for
        # important env. vars.
{% if 'conda-forge' in channel_targets %}
        - CONDA_FORGE=yes
{% else %}
        - CONDA_FORGE=no
{% endif %}
      missing_dso_whitelist:   # [win]
        - '**/MSVCR71.dll'  # [win]
        - '**/MSVCR80.dll'  # [win]
        # I have no idea why this is not in C:\Windows\System32\downlevel
        - '**/api-ms-win-core-path-l1-1-0.dll'  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
        - make  # [not win]
        - libtool  # [unix]
        - pkg-config  # [not win]
        # configure script looks for llvm-ar for lto
        - llvm-tools  # [osx]
        - ld_impl_{{ target_platform }}  # [linux]
      host:
        - bzip2
        - sqlite
        - liblzma-devel
        - zlib
        - openssl
        - readline  # [not win]
        - tk
        # These two are just to get the headers needed for tk.h, but is unused
        - xorg-libx11       # [unix]
        - xorg-xorgproto    # [unix]
        - ncurses  # [unix]
        - libffi
        - ld_impl_{{ target_platform }} >=2.36.1  # [linux]
        - libnsl  # [linux]
        - libuuid  # [linux]
        - libxcrypt  # [linux]
        - expat
      run:
        - ld_impl_{{ target_platform }} >=2.36.1  # [linux]
        - tzdata
      run_constrained:
        - python_abi {{ ver2 }}.* *_cp{{ ver2nd }}
    test:
      downstreams:
        - cython
        - setuptools
      requires:
        - ripgrep
        - cmake
        - ninja
        # Pin to the openssl version used during the build to check whether
        # we load the conda-forge version.
        - openssl {{ openssl }}
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        # Tried to use enable_language(C) to avoid needing this. It does not work.
        - {{ compiler('cxx') }}
        # For tkinter, but we expect from system
        - xorg-libx11   # [unix]
      files:
        - tests/distutils/*
        - tests/cmake/*
        - tests/cython/*
        - run_test.py
      commands:
        - echo on  # [win]
        - set  # [win]
        - python -V
        - python3 -V            # [not win]
        - 2to3 -h
        - pydoc -h
        - python3-config --help  # [not win]
        - set "PIP_NO_BUILD_ISOLATION=False"  # [win]
        - set "PIP_NO_DEPENDENCIES=True"  # [win]
        - set "PIP_IGNORE_INSTALLED=True"  # [win]
        - set "PIP_NO_INDEX=True"  # [win]
        - set "PIP_CACHE_DIR=%CONDA_PREFIX%/pip_cache"  # [win]
        - set "TEMP=%CONDA_PREFIX%/tmp"  # [win]
        - mkdir "%TEMP%"  # [win]
        - python -Im ensurepip --upgrade --default-pip  # [win]
        # tzdata/zoneinfo test that will need the tzdata package to pass
        - python -c "from zoneinfo import ZoneInfo; from datetime import datetime; dt = datetime(2020, 10, 31, 12, tzinfo=ZoneInfo('America/Los_Angeles')); print(dt.tzname())"
        - python -m venv test-venv
        - test-venv\\Scripts\\python.exe -c "import ctypes"  # [win]
        - test-venv/bin/python -c "import ctypes"            # [unix]
        - python -c "import sysconfig; print(sysconfig.get_config_var('CC'))"  # [not win]
        - _CONDA_PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata_x86_64_conda_linux_gnu python -c "import sysconfig; print(sysconfig.get_config_var('CC'))"   # [linux64]
        - for f in ${CONDA_PREFIX}/lib/python*/_sysconfig*.py; do echo "Checking $f:"; if [[ `rg @ $f` ]]; then echo "FAILED ON $f"; cat $f; exit 1; fi; done  # [linux64 or osx]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.so           # [unix]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.a            # [unix]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.so           # [linux]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.dylib        # [osx]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.nolto.a      # [unix]
        # https://github.com/conda-forge/python-feedstock/issues/384
        - if exist %PREFIX%\\Scripts\\pydoc exit 1  # [win]
        - if exist %PREFIX%\\Scripts\\idle exit 1  # [win]
        - if exist %PREFIX%\\Scripts\\2to3 exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\pydoc-script.py exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\idle-script.py exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\2to3-script.py exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\idle.exe exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\2to3.exe exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\pydoc.exe exit 1  # [win]
        - pushd tests
        - pushd cmake
        - cmake -GNinja {{ cmake_test_args }} -DPY_VER={{ version }} -DEXTRA_COMPONENTS="Development.Module" --debug-find --trace --debug-output --debug-trycompile .
        - popd
        - popd
        - python run_test.py
        - test ! -f default.profraw   # [osx]
        # Test workaround for https://github.com/conda/conda/issues/10969
        - test -d "$PREFIX/lib/python3.1/site-packages"  # [unix]
        - python3.1 --version  # [unix]
        # Test for segfault on osx-64 with libffi=3.4, see https://bugs.python.org/issue44556
        - python -c "from ctypes import CFUNCTYPE; CFUNCTYPE(None)(id)"
        # Test for wide character supported via ncursesw
        - TERM=xterm >/dev/null python -c "import curses; scr = curses.initscr(); curses.unget_wch('x'); assert 'x' ==  scr.get_wch()"  # [unix]
        # crypt module will be removed in 3.13 => this failing is a reminder to remove the libxcrypt dependency
        - python -c "import crypt"  # [unix]

  - name: libpython
    script: build_shared.sh  # [unix]
    script: build_shared.bat  # [win]
    build:
      number: {{ build_number }}
      activate_in_script: true
      ignore_run_exports:
        - python_abi
      script_env:
        - PY_INTERP_DEBUG={{ py_interp_debug }}
      string: h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}{{ debug }}_cpython
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
      host:
        - {{ pin_subpackage('python', exact=True) }}
      run:
        - {{ pin_subpackage('python', exact=True) }}
    test:
      files:
        - tests/cmake/*
        - tests/prefix-replacement/*
      requires:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        # cmake expects a C++ compiler for some reason
        - {{ compiler('cxx') }}
        - ripgrep
        - cmake
        - ninja
      commands:
        - VER=${PKG_VERSION%.*}    # [not win]
        - VERABI=${VER}            # [not win]
        - VERABI_NO_DBG=${VERABI}  # [not win]
{% if py_interp_debug == "yes" %}
        - VERABI=${VERABI}d        # [not win]
{% endif %}
        - test -f ${PREFIX}/lib/libpython${VERABI}.so                # [linux]
        - test -f ${PREFIX}/lib/libpython3.so                        # [linux and build_type == "release"]
        - test -f ${PREFIX}/lib/libpython${VERABI}.dylib             # [osx]
        - pushd tests
        - pushd prefix-replacement  # [unix]
        - bash build-and-test.sh    # [unix]
        - popd                      # [unix]
        - pushd cmake
        - cmake -GNinja {{ cmake_test_args }} -DPY_VER={{ version }} -DEXTRA_COMPONENTS="Development.Embed" --debug-find --trace --debug-output --debug-trycompile .
        - popd
        - popd

  - name: libpython-static
    script: build_static.sh  # [unix]
    script: build_static.bat  # [win]
    build:
      number: {{ build_number }}
      activate_in_script: true
      ignore_run_exports:
        - python_abi
      script_env:
        - PY_INTERP_DEBUG={{ py_interp_debug }}
      string: h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}{{ debug }}_cpython
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
      host:
        - {{ pin_subpackage('python', exact=True) }}
      run:
        - {{ pin_subpackage('python', exact=True) }}
    test:
      files:
        - tests/cmake/*
        - tests/prefix-replacement/*
      requires:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        # cmake expects a C++ compiler for some reason
        - {{ compiler('cxx') }}
        - ripgrep
        - cmake
        - ninja
      commands:
        - VER=${PKG_VERSION%.*}   # [not win]
{% if py_interp_debug == "yes" %}
        - VERABI=${VER}d    # [not win]
{% else %}
        - VERABI=${VER}   # [not win]
{% endif %}
        - test -f ${PREFIX}/lib/libpython${VERABI}.a  # [unix]
        - test -f ${PREFIX}/lib/libpython${VERABI}.nolto.a  # [unix]
        - test -f ${PREFIX}/lib/python${VER}/config-${VERABI}-darwin/libpython${VERABI}.a  # [osx]
        - pushd tests
        - pushd prefix-replacement  # [unix]
        - bash build-and-test.sh    # [unix]
        - popd                      # [unix]
        - pushd cmake
        - cmake -GNinja {{ cmake_test_args }} -DPY_VER={{ version }} -DEXTRA_COMPONENTS="Development.Embed" --debug-find --trace --debug-output --debug-trycompile .
        - popd
        - popd

  - name: cpython
    build:
      noarch: generic
    requirements:
      - python {{ version }}.*
      - python_abi * *_cp{{ ver2nd }}

  - name: python-gil
    build:
      noarch: generic
    requirements:
      - cpython {{ version }}.*
      - python_abi * *_cp{{ ver2nd }}

about:
  home: https://www.python.org/
  license: Python-2.0
  license_file: LICENSE
  summary: General purpose programming language
  description: |
    Python is a widely used high-level, general-purpose, interpreted, dynamic
    programming language. Its design philosophy emphasizes code
    readability, and its syntax allows programmers to express concepts in
    fewer lines of code than would be possible in languages such as C++ or
    Java. The language provides constructs intended to enable clear programs
    on both a small and large scale.
  doc_url: https://www.python.org/doc/versions/
  doc_source_url: https://github.com/python/pythondotorg/blob/master/docs/source/index.rst
  dev_url: https://docs.python.org/devguide/

